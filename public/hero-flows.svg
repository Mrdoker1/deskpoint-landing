<svg xmlns="http://www.w3.org/2000/svg" width="700" height="800" viewBox="0 0 700 800" fill="none" aria-hidden="true">
  <style>
    /* Pulses travel along the same curves as the static lines and die out at
       the hub. Everything is slow and low-contrast so the headline stays first
       in the reading order. */
    .pulse {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 0.10 0.90;
      animation: flow linear infinite;
    }
    @keyframes flow {
      from { stroke-dashoffset: 1; }
      to   { stroke-dashoffset: 0; }
    }
    .ring-crawl { animation: crawl 26s linear infinite; }
    @keyframes crawl {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 96; }
    }
    .ping { animation: ping 5.5s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
    @keyframes ping {
      0%        { r: 44; stroke-opacity: 0.5; }
      70%, 100% { r: 92; stroke-opacity: 0; }
    }
    .hub { animation: hub 5.5s ease-in-out infinite; }
    @keyframes hub {
      0%, 100% { r: 15; }
      50%      { r: 16.6; }
    }
    .twinkle { animation: twinkle 7s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    .emit { animation: emit 6.5s ease-in-out infinite; }
    @keyframes emit {
      0%, 100% { stroke-opacity: 0.25; }
      50%      { stroke-opacity: 0.7; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .ring-crawl, .ping, .hub, .twinkle, .emit { animation: none; }
      .pulse { display: none; }
    }
  </style>
  <path class="pulse" d="M -30 60 C 270.0 90, 190.0 380, 470 400" pathLength="1" stroke="#74452c" stroke-opacity="0.55" stroke-width="2.2" style="animation-duration:13.0s;animation-delay:-0.0s"/>
  <path class="pulse" d="M -30 210 C 270.0 240, 190.0 380, 470 400" pathLength="1" stroke="#74452c" stroke-opacity="0.55" stroke-width="2.2" style="animation-duration:9.5s;animation-delay:-2.4s"/>
  <path class="pulse" d="M -30 380 C 270.0 410, 190.0 380, 470 400" pathLength="1" stroke="#74452c" stroke-opacity="0.55" stroke-width="2.2" style="animation-duration:8.0s;animation-delay:-4.1s"/>
